<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bites · Share a find</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}html,body,*{scrollbar-width:none}::-webkit-scrollbar{display:none}
a{color:#4a2e18}a:hover{color:#1f140c}
.field{transition:border-color .2s,box-shadow .2s}
.field:focus-within{border-color:#c8962e;box-shadow:0 0 0 4px rgba(245,200,66,.35)}
.item{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.ring circle{opacity:.25;animation:tick 1.2s linear infinite}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes tick{0%{opacity:1}55%,100%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.item{animation:none}.ring circle{animation:none;opacity:.8}.field{transition:none}}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#fbf2dc;color:#1f140c;font-family:'Plus Jakarta Sans',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;padding:24px 20px 28px;gap:18px">
  <div style="display:flex;align-items:center;gap:12px">
    <a href="Home.dc.html" aria-label="Back" style="width:44px;height:44px;border-radius:22px;display:grid;place-items:center;margin-left:-10px">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <div style="font-size:26px;font-weight:800;letter-spacing:-.8px">Share a find</div>
  </div>

  <div style="font-size:15px;color:#6b4423;line-height:1.5;padding:0 4px">Paste a reel or post link. We check it, and if we can confirm the place, it shows up in Bites.</div>

  <div style="display:flex;flex-direction:column;gap:10px">
    <label class="field" style="display:flex;flex-direction:column;gap:4px;border:1.5px solid #ead7b1;border-radius:18px;background:#fffcf5;padding:10px 18px">
      <span style="font-size:12px;font-weight:700;color:#6b4423">Link</span>
      <input type="url" placeholder="instagram.com/reel/…" style="border:none;background:transparent;font:inherit;font-size:16px;color:#1f140c;outline:none;padding:0">
    </label>
    <button onClick="{{send}}" style="height:56px;border:none;border-radius:28px;background:#1f140c;color:#fbf2dc;font:inherit;font-weight:700;font-size:16px;cursor:pointer">Send</button>
    <button style="min-height:44px;border:none;background:none;font:inherit;font-size:14px;font-weight:700;color:#4a2e18;text-decoration:underline;text-underline-offset:4px;cursor:pointer">Upload a video instead</button>
  </div>

  <div style="font-size:16px;font-weight:800;padding:0 4px;margin-top:4px">Your finds</div>
  <div style="display:flex;flex-direction:column">
    <sc-for list="{{finds}}" as="f" hint-placeholder-count="3">
      <div class="item" style="display:flex;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid #ead7b1">
        <div style="flex:1;min-width:0">
          <div style="font-size:15px;font-weight:700">{{f.title}}</div>
          <div style="font-size:13px;color:#6b4423;margin-top:2px">{{f.when}}</div>
        </div>
        <sc-if value="{{f.checking}}" hint-placeholder-val="{{false}}">
          <span style="display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#8a5a2b">
            <svg class="ring" aria-hidden="true" width="16" height="16" viewBox="-8 -8 16 16"><circle cx="0" cy="-6" r="1.6" fill="#c8962e" style="animation-delay:0s"></circle><circle cx="5.2" cy="-3" r="1.6" fill="#c8962e" style="animation-delay:.2s"></circle><circle cx="5.2" cy="3" r="1.6" fill="#c8962e" style="animation-delay:.4s"></circle><circle cx="0" cy="6" r="1.6" fill="#c8962e" style="animation-delay:.6s"></circle><circle cx="-5.2" cy="3" r="1.6" fill="#c8962e" style="animation-delay:.8s"></circle><circle cx="-5.2" cy="-3" r="1.6" fill="#c8962e" style="animation-delay:1s"></circle></svg>
            Checking
          </span>
        </sc-if>
        <sc-if value="{{f.added}}" hint-placeholder-val="{{false}}">
          <span style="font-size:12px;font-weight:700;background:#9bbf65;color:#1f140c;border-radius:12px;padding:4px 10px">Added</span>
        </sc-if>
        <sc-if value="{{f.unsure}}" hint-placeholder-val="{{false}}">
          <span style="font-size:12px;font-weight:700;color:#6b4423;border:1.5px solid #dec69b;border-radius:12px;padding:3px 9px">Couldn’t confirm</span>
        </sc-if>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sent: 0 }; }
  renderVals() {
    const base = [
      { title: 'Reel from @coimbatorefoodie', when: 'Yesterday', status: 'added' },
      { title: 'Post about a rooftop café', when: '3 days ago', status: 'unsure' }
    ];
    const fresh = Array.from({ length: this.state.sent }, () => ({ title: 'New link', when: 'Just now', status: 'checking' }));
    const finds = fresh.concat([{ title: 'Reel about a dosa place', when: '1 hour ago', status: 'checking' }], base).map((f) => ({
      ...f, checking: f.status === 'checking', added: f.status === 'added', unsure: f.status === 'unsure'
    }));
    return { finds, send: () => this.setState({ sent: Math.min(this.state.sent + 1, 2) }) };
  }
}
</script>
</body>
</html>
