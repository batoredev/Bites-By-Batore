<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bites · Saved</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}html,body,*{scrollbar-width:none}::-webkit-scrollbar{display:none}
a{color:#4a2e18}a:hover{color:#1f140c}
.star{background:#f5c842;-webkit-mask:url(/_blob/98a5385507d3c5e2bcc8a282f933aad7) center/contain no-repeat;mask:url(/_blob/98a5385507d3c5e2bcc8a282f933aad7) center/contain no-repeat}
.seg{transition:background .25s,color .25s}
.item{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.blink{animation:blink 2s ease-in-out infinite}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.item,.blink{animation:none}.seg{transition:none}}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#fbf2dc;color:#1f140c;font-family:'Plus Jakarta Sans',system-ui,sans-serif;display:flex;flex-direction:column;position:relative;overflow:hidden;padding:28px 20px 0;gap:18px">
  <div style="font-size:30px;font-weight:800;letter-spacing:-1px;padding:0 4px">Saved</div>

  <div role="tablist" aria-label="Saved items" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;background:#f3e4c4;border-radius:24px;padding:4px">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="2">
      <button class="seg" role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
    </sc-for>
  </div>

  <sc-if value="{{showPlans}}" hint-placeholder-val="{{true}}">
    <div style="display:flex;flex-direction:column;gap:12px">
      <a class="item" href="Plan.dc.html" style="display:flex;flex-direction:column;gap:12px;background:#fffcf5;border-radius:22px;padding:18px;text-decoration:none;color:#1f140c">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span style="font-size:13px;font-weight:700;color:#8a5a2b">Sat 23 Nov · 7 pm</span>
          <span style="font-size:12px;font-weight:700;background:#9bbf65;border-radius:12px;padding:4px 10px">Coming up</span>
        </div>
        <div style="font-size:18px;font-weight:800">Board games and street food</div>
        <div style="display:flex;align-items:center;gap:8px;font-size:13px;color:#6b4423">
          <span class="blink" style="width:8px;height:8px;border-radius:50%;background:#c8962e;flex-shrink:0"></span>
          Street food lane now closes at 10 pm. Your plan still fits.
        </div>
      </a>
      <a class="item" href="Plan.dc.html" style="display:flex;flex-direction:column;gap:8px;background:#fffcf5;border-radius:22px;padding:18px;text-decoration:none;color:#1f140c;animation-delay:.06s">
        <span style="font-size:13px;font-weight:700;color:#8a5a2b">No date yet</span>
        <div style="font-size:18px;font-weight:800">Coffee, a walk and dosa</div>
        <div style="font-size:13px;color:#6b4423">3 stops · About ₹540 per person</div>
      </a>
    </div>
  </sc-if>

  <sc-if value="{{showPlaces}}" hint-placeholder-val="{{false}}">
    <div style="display:flex;flex-direction:column">
      <sc-for list="{{places}}" as="p" hint-placeholder-count="4">
        <a class="item" href="Place.dc.html" style="display:flex;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid #ead7b1;text-decoration:none;color:#1f140c;animation-delay:{{p.delay}}">
          <span style="width:46px;height:46px;border-radius:16px;background:{{p.tint}};flex-shrink:0"></span>
          <span style="flex:1;min-width:0">
            <span style="display:block;font-size:16px;font-weight:700">{{p.name}}</span>
            <span style="display:block;font-size:13px;color:#6b4423;margin-top:2px">{{p.note}}</span>
          </span>
        </a>
      </sc-for>
    </div>
  </sc-if>

  <nav aria-label="Main" style="position:absolute;left:20px;right:20px;bottom:24px;height:68px;border-radius:34px;background:#1f140c;display:flex;justify-content:space-around;align-items:center;box-shadow:0 16px 30px -16px rgba(31,20,12,.6)">
    <a href="Home.dc.html" aria-label="Home" style="width:56px;height:56px;display:grid;place-items:center;opacity:.6">
      <span class="star" style="display:block;width:28px;height:28px"></span>
    </a>
    <a href="Explore.dc.html" aria-label="Explore" style="width:56px;height:56px;display:grid;place-items:center;opacity:.6">
      <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#f5c842" stroke-width="2" stroke-linejoin="round"><path d="M3 5.5 8.5 3l7 2.5L21 3v15.5L15.5 21l-7-2.5L3 21z"></path><path d="M8.5 3v15.5M15.5 5.5V21"></path><g fill="#9bbf65" stroke="none"><circle cx="5.6" cy="16.2" r=".9"></circle><circle cx="7.6" cy="14.8" r=".9"></circle><circle cx="10.2" cy="14" r=".9"></circle><circle cx="12.6" cy="12.4" r=".9"></circle><circle cx="15.2" cy="11" r=".9"></circle><circle cx="18.2" cy="8.4" r="1.6"></circle></g></svg>
    </a>
    <a href="Saved.dc.html" aria-label="Saved" aria-current="page" style="width:56px;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;text-decoration:none">
      <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#f5c842" stroke-width="2" stroke-linejoin="round"><path d="M6 3.5h12v17l-6-4.2-6 4.2z"></path><circle cx="12" cy="9.5" r="1.6" fill="#9bbf65" stroke="none"></circle></svg>
      <span style="width:5px;height:5px;border-radius:50%;background:#f5c842"></span>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'plans' }; }
  renderVals() {
    const tabs = [['plans', 'Plans'], ['places', 'Places']].map(([id, label]) => {
      const on = this.state.tab === id;
      return {
        label, on: String(on), pick: () => this.setState({ tab: id }),
        style: 'min-height:44px;border:none;border-radius:20px;font:inherit;font-size:15px;font-weight:700;cursor:pointer;' + (on ? 'background:#1f140c;color:#fbf2dc' : 'background:transparent;color:#6b4423')
      };
    });
    const tints = ['#f5c842', '#c8962e', '#dec69b', '#8a5a2b'];
    const places = [['Dosa place', 'South Indian · RS Puram'], ['Board game café', 'Games · Saibaba Colony'], ['Rooftop restaurant', 'Dinner · Race Course'], ['Quiet café', 'Coffee · Gandhipuram']]
      .map(([name, note], k) => ({ name, note, tint: tints[k], delay: (k * 0.05) + 's' }));
    return { tabs, places, showPlans: this.state.tab === 'plans', showPlaces: this.state.tab === 'places' };
  }
}
</script>
</body>
</html>
