<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bites · Set the vibe</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;family=Fraunces:ital,opsz,wght@1,9..144,600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}html,body,*{scrollbar-width:none}::-webkit-scrollbar{display:none}
a{color:#4a2e18}a:hover{color:#1f140c}
.card{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.chip{transition:background .25s,transform .25s,border-color .25s}
.chip:active{transform:scale(.94)}
.on{animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.bdot{transition:background .25s,transform .25s}
.bdot:hover{transform:scale(1.25)}
.stepdot{transition:width .3s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.9)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.card,.on{animation:none}.chip,.bdot{transition:none}}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#fbf2dc;color:#1f140c;font-family:'Plus Jakarta Sans',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden">
  <div style="display:flex;align-items:center;justify-content:space-between;padding:22px 20px 8px">
    <a href="Main.dc.html" aria-label="Back" style="width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:#f3e4c4;text-decoration:none">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <div aria-label="Step 1 of 2" style="display:flex;gap:6px;align-items:center">
      <span class="stepdot" style="width:22px;height:8px;border-radius:4px;background:#1f140c"></span>
      <span class="stepdot" style="width:8px;height:8px;border-radius:4px;background:#dec69b"></span>
    </div>
    <span style="width:44px"></span>
  </div>

  <div style="padding:6px 22px 14px">
    <div style="font-size:30px;font-weight:800;letter-spacing:-1px;line-height:1.1">What’s the <span style="font-family:Fraunces,serif;font-style:italic;font-weight:600;color:#8a5a2b">vibe</span> today?</div>
  </div>

  <div style="flex:1;overflow:hidden;padding:0 16px;display:flex;flex-direction:column;gap:12px">
    <div class="card" style="background:#fffcf5;border-radius:22px;padding:16px;box-shadow:0 1px 0 #ead7b1">
      <div style="font-size:14px;font-weight:700;color:#6b4423">Your mood</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px">
        <sc-for list="{{moods}}" as="m" hint-placeholder-count="4">
          <button class="chip {{m.cls}}" onClick="{{m.pick}}" aria-pressed="{{m.on}}" style="{{m.style}}">{{m.label}}</button>
        </sc-for>
      </div>
    </div>

    <div class="card" style="background:#fffcf5;border-radius:22px;padding:16px;box-shadow:0 1px 0 #ead7b1;animation-delay:.06s">
      <div style="font-size:14px;font-weight:700;color:#6b4423">Who’s coming</div>
      <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px">
        <sc-for list="{{people}}" as="p" hint-placeholder-count="4">
          <button class="chip {{p.cls}}" onClick="{{p.pick}}" aria-pressed="{{p.on}}" style="{{p.style}}">
            <span style="display:flex;gap:3px;justify-content:center;height:12px;align-items:center">
              <sc-for list="{{p.dots}}" as="d"><span style="width:9px;height:9px;border-radius:50%;background:currentColor"></span></sc-for>
            </span>
            <span style="font-size:12px;font-weight:700">{{p.label}}</span>
          </button>
        </sc-for>
      </div>
    </div>

    <div class="card" style="background:#fffcf5;border-radius:22px;padding:16px;box-shadow:0 1px 0 #ead7b1;animation-delay:.12s">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <div style="font-size:14px;font-weight:700;color:#6b4423">Budget</div>
        <div style="font-size:20px;font-weight:800">₹{{budget}} <span style="font-size:13px;font-weight:600;color:#6b4423">per person</span></div>
      </div>
      <div style="display:flex;justify-content:space-between;margin-top:14px">
        <sc-for list="{{bdots}}" as="b" hint-placeholder-count="12">
          <button class="bdot" onClick="{{b.pick}}" aria-label="₹{{b.value}} per person" style="width:24px;height:24px;border:none;padding:0;border-radius:50%;background:transparent;display:grid;place-items:center;cursor:pointer">
            <span style="{{b.style}}"></span>
          </button>
        </sc-for>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:11px;color:#6b4423;margin-top:6px"><span>₹200</span><span>₹1,300</span></div>
    </div>

    <div class="card" style="background:#fffcf5;border-radius:22px;padding:16px;box-shadow:0 1px 0 #ead7b1;animation-delay:.18s">
      <div style="font-size:14px;font-weight:700;color:#6b4423">Interests</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px">
        <sc-for list="{{interests}}" as="i" hint-placeholder-count="6">
          <button class="chip {{i.cls}}" onClick="{{i.pick}}" aria-pressed="{{i.on}}" style="{{i.style}}">{{i.label}}</button>
        </sc-for>
      </div>
    </div>
  </div>

  <div style="padding:14px 16px 28px">
    <a href="Planning.dc.html" style="display:flex;align-items:center;justify-content:center;gap:10px;height:58px;border-radius:18px;background:#1f140c;color:#fbf2dc;font-weight:800;font-size:17px;text-decoration:none">Make my plan
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#f5c842" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mood: 'Chill', people: 'A date', budget: 6, picks: { 'Coffee': true, 'Live music': true } };
  }
  chipStyle(on) {
    return 'min-height:44px;padding:0 16px;border-radius:22px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;border:1.5px solid ' +
      (on ? '#c8962e;background:#f5c842;color:#1f140c' : '#ead7b1;background:#fffcf5;color:#4a2e18');
  }
  renderVals() {
    const s = this.state;
    const moods = ['Chill', 'Hyped', 'Low-key', 'Curious', 'Hungry'].map((label) => {
      const on = s.mood === label;
      return { label, on: String(on), cls: on ? 'on' : '', style: this.chipStyle(on), pick: () => this.setState({ mood: label }) };
    });
    const people = [['Just me', 1], ['A date', 2], ['Family', 4], ['The gang', 3]].map(([label, n]) => {
      const on = s.people === label;
      return {
        label, on: String(on), cls: on ? 'on' : '', dots: Array.from({ length: n }, (_, k) => ({ k })),
        style: 'min-height:64px;padding:8px 4px;border-radius:16px;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;border:1.5px solid ' +
          (on ? '#c8962e;background:#f5c842;color:#1f140c' : '#ead7b1;background:#fffcf5;color:#8a5a2b'),
        pick: () => this.setState({ people: label })
      };
    });
    const bdots = Array.from({ length: 12 }, (_, k) => {
      const filled = k <= s.budget;
      const size = Math.min(8 + k, 18);
      return {
        value: 200 + k * 100,
        style: 'display:block;border-radius:50%;width:' + size + 'px;height:' + size + 'px;background:' + (filled ? (k === s.budget ? '#1f140c' : '#f5c842') : '#ead7b1'),
        pick: () => this.setState({ budget: k })
      };
    });
    const interests = ['Coffee', 'Gaming', 'Live music', 'Street food', 'Outdoors', 'Movies'].map((label) => {
      const on = !!s.picks[label];
      return { label, on: String(on), cls: on ? 'on' : '', style: this.chipStyle(on), pick: () => this.setState({ picks: Object.assign({}, s.picks, { [label]: !on }) }) };
    });
    return { moods, people, bdots, interests, budget: (200 + s.budget * 100).toLocaleString('en-IN') };
  }
}
</script>
</body>
</html>
