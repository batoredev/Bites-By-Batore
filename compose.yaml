services:
  api:
    build: .
    env_file: .env
    environment:
      DEMO_ALLOW_NETWORK: "true"
    ports: ["127.0.0.1:8000:8000"]
    restart: unless-stopped
    volumes: ["batore-data:/app/data"]
    healthcheck:
      test: ["CMD", "/app/backend/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    build: .
    env_file: .env
    command: ["/app/backend/.venv/bin/python", "-m", "app.jobs"]
    restart: unless-stopped
    volumes: ["batore-data:/app/data"]
    depends_on:
      api:
        condition: service_healthy
volumes:
  batore-data:
